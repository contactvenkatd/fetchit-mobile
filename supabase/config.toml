project_id = "fetchit-mobile"

[functions.attestation-challenge]
verify_jwt = false

[functions.verify-app-attest]
verify_jwt = false

[functions.verify-play-integrity]
verify_jwt = false

[functions.auth-gateway]
verify_jwt = false

[functions.parse-shopping-intent]
verify_jwt = true

# Usage quotas: handler auth.getUser checks back these gateway gates.
[functions.search-products]
verify_jwt = true

[functions.usage-status]
verify_jwt = true

# Admin-only ops view; the handler also requires app_metadata.fetchit_admin.
[functions.ops-status]
verify_jwt = true

# Called by pg_cron (no user JWT); authenticated by the x-monitor-secret header.
[functions.zinc-balance-monitor]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.stripe-readiness]
verify_jwt = false

# Preserve the production JWT gateway gate as well as handler auth.getUser checks.
[functions.create-subscription]
verify_jwt = true
[functions.create-setup-intent]
verify_jwt = true
[functions.save-card]
verify_jwt = true
[functions.cancel-subscription]
verify_jwt = true
[functions.reactivate-subscription]
verify_jwt = true

# Narrow admin-only cleanup; validates CLI privilege and original-secret proof.
[functions.stripe-webhook-cleanup]
verify_jwt = false
